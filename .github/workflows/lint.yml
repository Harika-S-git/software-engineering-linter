name: Python Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Flake8 + Black + Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install quality dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python source
        run: python -m flake8 calculator.py quality_gate.py scripts tests
      - name: Check formatting
        run: python -m black --check calculator.py quality_gate.py scripts tests
      - name: Run automated tests
        run: python -m pytest -q tests
